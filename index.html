<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Memories</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  body{margin:0;color:#24324a;font:18px/32px Lora,Georgia,serif;
    background:#fbfbf7 repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#cfe0f1 31px,#cfe0f1 32px)}
  .page{max-width:760px;margin:0 auto;padding:48px 20px 96px 64px;position:relative}
  .page:before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:#e58a8a}
  h1,h2,.date,.cap{font-family:Caveat,"Comic Sans MS",cursive;font-weight:700}
  h1{font-size:68px;line-height:1.05;margin:0 0 8px}
  .sub{font-family:Caveat,cursive;font-size:28px;color:#c0504d;margin:0 0 32px}
  .intro{font-style:italic;margin:0 0 72px;white-space:pre-line}
  .entry{margin:0 0 72px}
  .date{font-size:26px;color:#c0504d;line-height:32px}
  h2{font-size:42px;line-height:44px;margin:4px 0 12px}
  .entry p{margin:0;white-space:pre-line}
  .photos{display:flex;flex-wrap:wrap;margin:24px -10px 0}
  .shot{position:relative;width:210px;margin:14px 10px;padding:9px 9px 6px;background:#fff;
    box-shadow:0 2px 7px rgba(36,50,74,.3);cursor:pointer}
  .shot:before{content:"";position:absolute;top:-12px;left:50%;width:64px;height:22px;margin-left:-32px;
    background:rgba(242,210,75,.75);transform:rotate(-3deg)}
  .shot img{display:block;width:210px;height:210px;object-fit:cover;background:#e8eef5}
  .cap{display:block;font-size:22px;line-height:28px;text-align:center;padding-top:4px;min-height:28px}
  .end{font-family:Caveat,cursive;font-size:34px;margin-top:24px}
  .lb{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,28,44,.92);
    align-items:center;justify-content:center;z-index:9;cursor:pointer}
  .lb.on{display:flex}
  .lb img{max-width:92vw;max-height:88vh}
  @media (max-width:560px){
    body{font-size:17px}
    .page{padding:32px 16px 72px 44px}
    .page:before{left:26px}
    h1{font-size:52px}
    .shot,.shot img{width:100%}
    .shot{margin-left:0;margin-right:0}
  }
</style>
</head>
<body>
<div class="page">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <p class="intro" id="intro"></p>
  <div id="entries"></div>
  <p class="end" id="end"></p>
</div>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>

<script>
/* ============ EDIT THIS PART ============ */
var SITE = {
  title: "Our Memories",
  subtitle: "Section ______ · Batch 2026",
  intro: "This is my last gift to all of you.\nEvery page is a memory we made together.",
  end: "Thank you for everything. Until we meet again!  — your name"
};

var ENTRIES = [
  {
    date: "June 2024",
    title: "First day as a section",
    text: "Write your story here. Who was there, what happened, what was funny.",
    photos: [
      // { src: "photos/first-day.jpg", caption: "Everyone was so shy" }
    ]
  },
  {
    date: "December 2024",
    title: "Christmas party",
    text: "Another memory goes here.",
    photos: []
  }
];
/* ============ END OF EDIT AREA ============ */

var tilt = [-2.5, 1.5, -1, 2.5, -1.5, 2];

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text) n.textContent = text;
  return n;
}

document.title = SITE.title;
document.getElementById("title").textContent = SITE.title;
document.getElementById("subtitle").textContent = SITE.subtitle;
document.getElementById("intro").textContent = SITE.intro;
document.getElementById("end").textContent = SITE.end;

var box = document.getElementById("entries");
var lb = document.getElementById("lb");
var lbimg = document.getElementById("lbimg");

ENTRIES.forEach(function (e) {
  var sec = el("section", "entry");
  sec.appendChild(el("div", "date", e.date));
  sec.appendChild(el("h2", "", e.title));
  sec.appendChild(el("p", "", e.text));
  if (e.photos && e.photos.length) {
    var row = el("div", "photos");
    e.photos.forEach(function (p, i) {
      var shot = el("figure", "shot");
      shot.style.transform = "rotate(" + tilt[i % tilt.length] + "deg)";
      var img = el("img");
      img.src = p.src;
      img.alt = p.caption || e.title;
      img.loading = "lazy";
      shot.appendChild(img);
      shot.appendChild(el("span", "cap", p.caption || ""));
      shot.onclick = function () { lbimg.src = p.src; lb.className = "lb on"; };
      row.appendChild(shot);
    });
    sec.appendChild(row);
  }
  box.appendChild(sec);
});

lb.onclick = function () { lb.className = "lb"; };
document.onkeydown = function (ev) { if (ev.key === "Escape") lb.className = "lb"; };
</script>
</body>
</html>
